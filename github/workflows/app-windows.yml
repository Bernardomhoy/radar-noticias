# Monta o Radar de Notícias para Windows (.exe) e publica na página "Releases" do repositório.
name: app-windows

on:
  push:
    paths:
      - "radar-noticias-codigo/desktop/**"
      - ".github/workflows/app-windows.yml"
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: radar-noticias-codigo

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install pywebview==5.3.2 pyinstaller==6.11.1

      - name: Endereço do site
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          url="${SITE_URL:-https://radar-noticias.netlify.app}"
          sed -i "s#__SITE_URL__#${url}#" desktop/radar_app.py
          grep -n "SITE =" desktop/radar_app.py

      - name: Gera o .exe
        run: pyinstaller --onefile --windowed --name Radar-de-Noticias --icon desktop/icone.ico desktop/radar_app.py

      - name: Publica em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-windows
          name: Radar de Notícias para Windows
          body: |
            Baixe **Radar-de-Noticias.exe** abaixo e dê dois cliques para abrir.
            Se o Windows avisar "O Windows protegeu o computador", clique em *Mais informações* → *Executar assim mesmo* (o app não tem assinatura paga).
          files: radar-noticias-codigo/dist/Radar-de-Noticias.exe
          make_latest: true
