# Rodada automática do radar: coleta, curadoria e painel novo para o Netlify.
# Robô 24 h: roda sozinho no GitHub a cada 30 min, lê os feeds RSS e atualiza o site.
# Horários em UTC (Brasília = UTC-3).
name: radar

on:
  schedule:
    - cron: "7,37 * * * *"     # a cada 30 min, 24 horas por dia (sem gastar token do Claude)
  workflow_dispatch: {}        # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

defaults:
  run:
    working-directory: radar-noticias-codigo   # pasta onde o código foi enviado pelo site

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coleta e curadoria
        run: |
          hoje=$(date +%F)
          # Se o agente do Claude já levantou matérias hoje, elas entram junto com o RSS.
          if [ -f "dados/ingest_${hoje}.json" ]; then
            python3 radar.py rodar --ingest "dados/ingest_${hoje}.json"
          else
            python3 radar.py rodar
          fi

      - name: Monta o site
        run: |
          cp saida/painel.html site/index.html
          date -Iseconds > site/atualizado.txt

      - name: Salva no repositório (o Netlify publica sozinho)
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add site saida dados config/preferencias.json
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "radar: rodada de $(date '+%d/%m %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
